# Mosquitto configuration for local EdgeAI Predictive Maintenance development.

listener 1883
protocol mqtt

# WebSocket listener so the dashboard frontend could subscribe directly
# if the Node backend bridge is bypassed in a simpler deployment.
listener 9001
protocol websockets

allow_anonymous true

# --- Production hardening (disabled by default for local dev) ---
# allow_anonymous false
# password_file /etc/mosquitto/passwd
#
# listener 8883
# protocol mqtt
# cafile /etc/mosquitto/certs/ca.crt
# certfile /etc/mosquitto/certs/server.crt
# keyfile /etc/mosquitto/certs/server.key

persistence true
persistence_location /var/lib/mosquitto/
log_dest stdout
